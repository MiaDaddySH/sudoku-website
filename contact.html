<!DOCTYPE html>
<html>

<head>
    <title>Contact Us - Sudoku World</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            line-height: 1.6;
        }
        h1 {
            color: #333;
        }
        p {
            margin-bottom: 10px;
        }
        nav {
            margin-bottom: 20px;
        }
        nav a {
            margin-right: 15px;
            text-decoration: none;
            color: #007BFF;
        }
        nav a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div id="lang-switch"><button type="button" data-lang="en">English</button><button type="button" data-lang="zh">中文</button></div>
    <nav>
        <a id="nav-home" href="index.html">Home</a>
        <a id="nav-privacy" href="privacy.html">Privacy Policy</a>
        <a id="nav-contact" href="contact.html">Contact Us</a>
    </nav>

    <h1 id="contact-title">Contact Us</h1>
    <p id="contact-desc">If you have any questions or concerns, please feel free to email us at <a href="mailto:yuangangsheng@googlemail.com">yuangangsheng@googlemail.com</a>.</p>

    <footer>
        <p id="footer-text">&copy; 2023 Sudoku World. All rights reserved.</p>
    </footer>
    <script>(function(){var zh={"nav-home":"首页","nav-privacy":"隐私政策","nav-contact":"联系我们","contact-title":"联系我们","contact-desc":"如果你有任何问题或疑虑，请发送邮件至 <a href=\"mailto:yuangangsheng@googlemail.com\">yuangangsheng@googlemail.com</a>。","footer-text":"© 2023 数独世界。保留所有权利。"};var originals={};document.querySelectorAll('[id]').forEach(function(el){originals[el.id]=el.innerHTML;});function apply(l){if(l==='zh'){Object.keys(zh).forEach(function(k){var el=document.getElementById(k);if(el)el.innerHTML=zh[k];});}else{Object.keys(originals).forEach(function(k){var el=document.getElementById(k);if(el)el.innerHTML=originals[k];});}try{localStorage.setItem('lang',l);}catch(e){}}var saved=null;try{saved=localStorage.getItem('lang');}catch(e){}apply(saved||(((navigator.language||'').slice(0,2))==='zh'?'zh':'en'));var s=document.getElementById('lang-switch');if(s){s.addEventListener('click',function(e){var t=e.target&&e.target.getAttribute('data-lang');if(t)apply(t);});}})();</script>
</body>

</html>
